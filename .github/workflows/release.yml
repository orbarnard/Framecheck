# Builds the Windows installer and the macOS disk images, and attaches them to
# the GitHub release when a v* tag is pushed. Run it by hand (Actions > Release
# packages > Run workflow) to get the packages as workflow artifacts without
# cutting a release.
#
# macOS signing is optional. With no secrets set, the DMGs are ad-hoc signed
# and the readme inside them explains the one-time Gatekeeper step. To ship
# signed, notarised builds, add these repository secrets:
#   MACOS_CERT_P12         base64 of a Developer ID Application .p12
#   MACOS_CERT_PASSWORD    its password
#   MACOS_CODESIGN_IDENTITY  "Developer ID Application: Name (TEAMID)"
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   for notarisation

name: Release packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tools/build_exe.py reads the git history of specs/ to know which
          # spec files an older release could have installed.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . "pyinstaller>=6.10,<7"
          choco install innosetup --no-progress -y

      - name: Fetch FFmpeg and libmpv
        run: python tools/fetch_binaries.py

      - name: Build
        run: python tools/build_exe.py --installer

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/FramecheckSetup-*.exe
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }} disk image
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . "pyinstaller>=6.10,<7"
          # mpv depends on ffmpeg, so this brings both; the app bundle
          # collects their shared libraries from Homebrew.
          brew install mpv

      - name: Fetch FFmpeg and libmpv
        run: python tools/fetch_binaries.py

      - name: Import signing certificate
        if: env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p actions "$RUNNER_TEMP/build.keychain"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/build.keychain"
          security unlock-keychain -p actions "$RUNNER_TEMP/build.keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$RUNNER_TEMP/build.keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions "$RUNNER_TEMP/build.keychain"
          security list-keychains -d user -s "$RUNNER_TEMP/build.keychain"
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build (unsigned)
        if: env.MACOS_CERT_P12 == ''
        run: python tools/build_mac.py --dmg

      - name: Build (signed and notarised)
        if: env.MACOS_CERT_P12 != ''
        env:
          FRAMECHECK_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: python tools/build_mac.py --dmg --sign

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/Framecheck-*-macos-*.dmg
          if-no-files-found: error

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/FramecheckSetup-*.exe
            packages/Framecheck-*-macos-*.dmg
