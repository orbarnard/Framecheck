[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "framecheck"
version = "0.1.0"
description = "Video, to spec."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "PySide6>=6.7",
    "python-mpv>=1.0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.gui-scripts]
framecheck = "framecheck.app.main:main"

[tool.setuptools.packages.find]
include = ["framecheck*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
